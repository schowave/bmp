# DOSBox configuration for js-dos (WASM/Browser)

[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=original
output=surface
autolock=false
sensitivity=100
waitonerror=false
priority=higher,normal
usescancodes=true

[dosbox]
machine=svga_s3
memsize=4

[render]
frameskip=0
aspect=true
scaler=none

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100

[joystick]
joysticktype=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
@echo off
mount c .
# D: points to a subdirectory of the same storage. The slot freezes the whole disk,
# so D: is just as persistent as C:. The point is consistency: in the VNC variant
# D: is the persistent drive and C: is volatile, and here the same instruction
# "save to D:" now applies instead of two different ones.
c:
# The directory can be missing when an older save is restored that was created
# before it was introduced. Then the mount fails silently, there is no D:, and the
# button in the game is dead. So create it first.
IF NOT EXIST SAVES\NUL MD SAVES
mount d ./SAVES
# START.BAT restarts the game as soon as it exits, and reports the exit over the
# DOS console, whereupon the page uploads the game state right away.
START.BAT
