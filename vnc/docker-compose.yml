services:
  bmp:
    image: schowave/bmp:latest
    container_name: bmp
    ports:
      - "8080:8080"
    volumes:
      - ./savegame:/savegame
    # The game stores its saves on drive D:, that is, in this mount. It belongs to
    # the host user, and on a Synology an ACL decides as well: the unprivileged game
    # process was not allowed to write there, even though the mode bits were set to
    # drwxrwxrwx. The ACL allows it for the group, so the process runs in that group
    # too. On Synology, 100 is the group users; on another host it is the group that
    # owns the directory.
    group_add:
      - "100"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"