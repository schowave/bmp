version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Playwright for the VNC benchmark that CI runs on every push.
  - package-ecosystem: "npm"
    directory: "/images/vnc/bench"
    schedule:
      interval: "weekly"

  # Base images of both Dockerfiles.
  - package-ecosystem: "docker"
    directories:
      - "/images/vnc"
      - "/images/wasm"
    schedule:
      interval: "weekly"
