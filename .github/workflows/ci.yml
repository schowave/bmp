name: CI

# Builds both images, runs the VNC benchmark against the VNC image and a smoke test
# against the WASM image, so a broken image shows up on the push instead of after the
# release. The remake job runs `mise run check`, the check command of AGENTS.md, over
# the Go re-implementation and the save server. The release workflow calls this as its
# first job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Only pushes to main write the build cache. Pull requests and the release, which
# calls this workflow and writes the cache itself, only read it, so a PR cannot
# fill the cache with layers main never builds.

jobs:
  remake:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remake
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: remake/go.mod
        cache-dependency-path: remake/go.sum

    # Ebitengine needs the GL and X11 headers to build (the list of its
    # install docs, not the much larger xorg-dev); the tests draw on offscreen
    # images, xvfb gives them a display anyway. The packages come from the
    # Actions cache: the Ubuntu mirror is at times slow (minutes for 3 MB).
    # Raise version to fetch them again from the mirror.
    - name: Install GL and X11 headers
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
        version: 1

    # Installs the tools pinned in mise.toml (golangci-lint); Go comes from go.mod above.
    - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

    # The same command as locally: lint, then vet, format and tests of remake/ and
    # wasm/. The remake tests compare the files built into the remake and the
    # constant tables with the original in bmp/ of the repository.
    - name: Check
      run: xvfb-run -a mise run check

    # The tests `check` skips with -short: they play whole seasons.
    - name: Long tests
      run: xvfb-run -a mise run remake:test-long

    # Reference docs of the remake packages, generated from the source.
    - name: Package docs
      run: |
        mkdir -p godoc
        for p in $(go list ./internal/...); do go doc -all "$p" > "godoc/$(basename "$p").txt"; done

    - name: Upload package docs
      uses: actions/upload-artifact@v7
      with:
        name: remake-godoc
        path: remake/godoc/

    # Every demo screen as a PNG, to look at what a change did to the screens.
    - name: Screenshots
      run: xvfb-run -a tools/shots.sh shots

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: remake-shots
        path: remake/shots/*.png
        if-no-files-found: ignore

  vnc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build VNC image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: vnc/Dockerfile
        platforms: linux/amd64
        load: true
        tags: bmp:ci
        cache-from: type=gha,scope=vnc
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=vnc' || '' }}

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: vnc/bench/package-lock.json

    - name: Install Playwright
      working-directory: vnc/bench
      run: |
        npm ci
        npx playwright install --with-deps chromium

    # Short run: enough for the checks (full picture, clicks arrive, DOSBox runs with
    # a client and pauses without one), not for comparing numbers.
    - name: Benchmark with checks
      working-directory: vnc/bench
      env:
        CONTAINER_CLI: docker
      run: node bench.mjs --label ci --image bmp:ci --secs 5 --clicks 5 --check

    - name: Upload screenshot and results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: vnc-bench
        path: |
          vnc/bench/shots/
          vnc/bench/results.jsonl
        if-no-files-found: ignore

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build WASM image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: wasm/Dockerfile
        platforms: linux/amd64
        load: true
        tags: bmp-wasm:ci
        cache-from: type=gha,scope=wasm
        cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=wasm' || '' }}

    # Page, bundle and the save API, without a browser.
    - name: Smoke test
      env:
        CONTAINER_CLI: docker
      run: wasm/smoke.sh bmp-wasm:ci
