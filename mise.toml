# Tasks for both images. Run `mise tasks` for an overview.
# Both images build with the repository root as context: vnc/Dockerfile for the
# VNC variant (tasks vnc:*), wasm/Dockerfile for the WASM variant (tasks wasm:*).

[tools]
golangci-lint = "2.14.0"

[env]
IMAGE_NAME = "bmp"
CONTAINER_NAME = "bmp"
PORT = "8080"

# --- VNC image ---------------------------------------------------------------

[tasks."vnc:build"]
description = "Build the container image"
# --format docker: in the default OCI format podman drops HEALTHCHECK.
run = "podman build --format docker -f vnc/Dockerfile -t $IMAGE_NAME ."

[tasks."vnc:stop"]
description = "Stop and remove the container"
run = [
  "podman stop $CONTAINER_NAME 2>/dev/null || true",
  "podman rm $CONTAINER_NAME 2>/dev/null || true",
]

[tasks."vnc:run"]
description = "Stop, build, and start in detached mode (saves in savegame/)"
depends = ["vnc:stop", "vnc:build"]
run = [
  "mkdir -p savegame",
  "podman run -d --name $CONTAINER_NAME -p $PORT:8080 -v \"$PWD/savegame:/savegame\" $IMAGE_NAME",
  "echo \"Running — open http://localhost:$PORT\"",
]

[tasks."vnc:bench"]
description = "Build the image and measure CPU, traffic and click latency (vnc/bench)"
depends = ["vnc:build"]
dir = "{{config_root}}/vnc/bench"
usage = 'arg "[label]" help="Name of the run in results.jsonl" default="local"'
run = [
  "npm ci --silent",
  "npx playwright install chromium",
  "node bench.mjs --image $IMAGE_NAME --label ${usage_label} --check",
  "node report.mjs",
]

# --- WASM image --------------------------------------------------------------

[tasks."wasm:build"]
description = "Build the web root with bmp.jsdos into wasm/dist"
# Only rebuilt when one of these changed.
sources = ["wasm/build-bundle.sh", "wasm/dosbox.conf", "wasm/index.html", "VERSION", "web/*", "bmp/**/*"]
outputs = ["wasm/dist/bmp.jsdos"]
run = "wasm/build-bundle.sh wasm/dist"

[tasks."wasm:docker"]
description = "Build the container image (bmp-wasm)"
run = "podman build --format docker -f wasm/Dockerfile -t bmp-wasm ."

[tasks."wasm:smoke"]
description = "Build the container image and smoke test it (page, bundle, save API)"
depends = ["wasm:docker"]
run = "wasm/smoke.sh bmp-wasm"

[tasks."wasm:run-docker"]
description = "Run the container locally (port 8090, saves in wasm/savegame)"
depends = ["wasm:docker"]
run = [
  "mkdir -p wasm/savegame",
  "echo 'Opening http://localhost:8090'",
  "open http://localhost:8090 || true",
  "podman run --rm -p 8090:8080 -v \"$PWD/wasm/savegame:/data\" bmp-wasm",
]

[tasks."wasm:run"]
description = "Local dev server for wasm/dist (python, no save persistence)"
depends = ["wasm:build"]
run = [
  "echo 'Opening http://localhost:8000 (no save persistence)'",
  "open http://localhost:8000 || true",
  "python3 -m http.server 8000 -d wasm/dist",
]

[tasks."wasm:test"]
description = "go.mod tidiness, vet, format check and unit tests of the save server"
dir = "{{config_root}}/wasm"
run = ["go mod tidy -diff", "go vet ./...", "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }", "go test ./..."]

[tasks."wasm:clean"]
description = "Remove the generated web root"
run = "rm -rf wasm/dist"

# --- Go re-implementation (remake/) ------------------------------------------

[tasks."remake:run"]
description = "Run the Go re-implementation"
dir = "{{config_root}}/remake"
run = "go run ./cmd/bmp"

[tasks."remake:restart"]
description = "Build and start the remake, ending the one this task started before"
dir = "{{config_root}}/remake"
# The pid file keeps the game this task started, so a restart ends only that
# one; a game ended so exits without an error. One pid file per checkout: a
# restart in a worktree leaves the game of the main checkout running.
run = '''
pidfile="${TMPDIR:-/tmp}/bmp-remake-$(pwd | shasum | cut -c1-8).pid"
if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
go build -o bin/bmp ./cmd/bmp
if command -v caffeinate >/dev/null; then caffeinate -u -t 2; fi
bin/bmp &
pid=$!
echo "$pid" > "$pidfile"
status=0
wait "$pid" || status=$?
[ "$(cat "$pidfile" 2>/dev/null)" = "$pid" ] && rm -f "$pidfile"
[ "$status" -eq 143 ] && exit 0
exit "$status"
'''

[tasks."remake:test"]
description = "go.mod tidiness, vet, format check and tests of the Go re-implementation (without the tests that play whole seasons)"
dir = "{{config_root}}/remake"
run = ["go mod tidy -diff", "go vet ./...", "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }", "go test -short -timeout 300s ./..."]

[tasks."remake:test-long"]
description = "All tests of the Go re-implementation, also those that play whole seasons (CI)"
dir = "{{config_root}}/remake"
run = "go test -timeout 600s ./..."

[tasks."remake:shot"]
description = "Screenshot of a remake screen: demo name, PNG path, optional input script"
dir = "{{config_root}}/remake"
usage = '''
arg "<demo>" help="Demo scene, listed by bmp -demos"
arg "<out>" help="PNG file (320x240)"
arg "[script]" help="Input script (internal/ui/script.go); without it the screen is shot after a few frames"
'''
# Ebitengine needs a monitor: on macOS caffeinate -u wakes a sleeping display
# first, otherwise bmp fails with "no monitor was found".
run = '''
if command -v caffeinate >/dev/null; then caffeinate -u -t 2; fi
if [ -n "${usage_script:-}" ]; then
  go run ./cmd/bmp -scale 1 -demo "$usage_demo" -script "$usage_script"
else
  go run ./cmd/bmp -scale 1 -demo "$usage_demo" -shot "$usage_out"
fi
'''

[tasks."re:build"]
description = "Disassemble and (with GHIDRA set) decompile BMMAIN.EXE into remake/tools/re/work"
run = "remake/tools/re/run.sh"

[tasks."remake:build"]
description = "Build remake/bin/bmp"
dir = "{{config_root}}/remake"
run = "go build -o bin/bmp ./cmd/bmp"

[tasks."remake:dist"]
description = "Build the remake as a Windows program and (on macOS) a Mac app, in remake/bin/dist"
dir = "{{config_root}}/remake"
# The game files are embedded, so each program is a single file. Ebitengine
# needs no cgo on Windows, so the .exe cross-compiles anywhere; the Mac app
# needs the macOS toolchain (cgo, lipo, codesign, iconutil). The app is signed
# ad hoc only: on another Mac, Gatekeeper asks before the first start (right
# click → Open). go-winres writes the icon and version of the .exe into a
# .syso file, which go build links into the Windows program only.
run = '''
set -e
out=bin/dist
version="$(cat ../VERSION)"
rm -rf "$out"
mkdir -p "$out"
trap 'rm -f cmd/bmp/rsrc_windows_*.syso' EXIT
go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --out cmd/bmp/rsrc \
  --icon cmd/bmp/icon.png --manifest gui \
  --product-name "Bundesliga Manager Professional" --file-description "Bundesliga Manager Professional" \
  --product-version "$version" --file-version "$version" --original-filename bmp.exe
GOOS=windows GOARCH=amd64 go build -trimpath -ldflags=-H=windowsgui -o "$out/bmp.exe" ./cmd/bmp
echo "$out/bmp.exe"
if [ "$(uname)" != Darwin ]; then
  echo "Mac app skipped: it needs macOS"
  exit 0
fi
app="$out/Bundesliga Manager Professional.app"
mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
iconset="$out/bmp.iconset"
mkdir -p "$iconset"
for px in 16 32 128 256 512; do
  sips -z $px $px cmd/bmp/icon.png --out "$iconset/icon_${px}x${px}.png" >/dev/null
  sips -z $((px * 2)) $((px * 2)) cmd/bmp/icon.png --out "$iconset/icon_${px}x${px}@2x.png" >/dev/null
done
iconutil -c icns -o "$app/Contents/Resources/bmp.icns" "$iconset"
rm -r "$iconset"
GOOS=darwin GOARCH=arm64 go build -trimpath -o "$out/bmp-arm64" ./cmd/bmp
GOOS=darwin GOARCH=amd64 go build -trimpath -o "$out/bmp-amd64" ./cmd/bmp
lipo -create -output "$app/Contents/MacOS/bmp" "$out/bmp-arm64" "$out/bmp-amd64"
rm "$out/bmp-arm64" "$out/bmp-amd64"
cat > "$app/Contents/Info.plist" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleName</key><string>Bundesliga Manager Professional</string>
  <key>CFBundleIdentifier</key><string>com.github.schowave.bmp</string>
  <key>CFBundleExecutable</key><string>bmp</string>
  <key>CFBundleIconFile</key><string>bmp</string>
  <key>CFBundlePackageType</key><string>APPL</string>
  <key>CFBundleShortVersionString</key><string>$version</string>
  <key>CFBundleVersion</key><string>$version</string>
  <key>LSMinimumSystemVersion</key><string>12.0</string>
  <key>NSHighResolutionCapable</key><true/>
</dict>
</plist>
EOF
codesign --force --deep --sign - "$app"
(cd "$out" && ditto -c -k --keepParent "Bundesliga Manager Professional.app" "Bundesliga Manager Professional.zip")
echo "$app"
echo "$out/Bundesliga Manager Professional.zip"
'''

[tasks."remake:icon"]
description = "Draw the icon of the remake from the title banner into remake/cmd/bmp/icon.png"
dir = "{{config_root}}/remake"
run = "go run ./cmd/bmpicon"

[tasks."remake:extract"]
description = "Extract the files the remake needs from bmp/ into remake/internal/embedded/data"
dir = "{{config_root}}/remake"
run = "go run ./cmd/bmpextract -data ../bmp -out internal/embedded/data"

[tasks."remake:seasons-update"]
description = "Fetch seasons from transfermarkt.de and write them into remake/internal/seasons/data (args: [FROM [TO]], default the running season)"
dir = "{{config_root}}/remake"
run = "tools/transfermarkt/update.sh"

[tasks."remake:seasons-games"]
description = "Order the squads of the seasons 1995/96 to 2003/04 by their games on transfermarkt.de (args: [FROM [TO]])"
dir = "{{config_root}}/remake"
run = "tools/transfermarkt/games.sh"

# --- Checks --------------------------------------------------------------------

[tasks.lint]
description = "golangci-lint over both Go modules (config: .golangci.yml), file names that differ only in case"
run = ["cd remake && golangci-lint run ./...", "cd wasm && golangci-lint run ./...", ".githooks/check-names"]

[tasks."remake:test-tm"]
description = "Tests of the Transfermarkt scripts (tools/transfermarkt), offline"
dir = "{{config_root}}/remake"
run = "python3 -B -m unittest discover -s tools/transfermarkt -p 'test_*.py'"

[tasks."remake:test-amd64"]
description = "On Apple Silicon: the tests of the seasons and the extract as amd64 (Rosetta), as CI runs them"
dir = "{{config_root}}/remake"
# Go fuses multiply and add (FMA) on arm64 but not on amd64, so float maths
# can give other logos or strengths on a Mac than in CI. Elsewhere CI's own
# run covers it.
run = '''
if [ "$(uname -sm)" != "Darwin arm64" ]; then exit 0; fi
if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
  echo "remake:test-amd64 needs Rosetta: softwareupdate --install-rosetta" >&2
  exit 1
fi
GOARCH=amd64 go test -short ./internal/seasons/... ./internal/assets/...
'''

[tasks.check]
description = "All fast checks: lint, remake vet/format/tests, save server tests"
depends = ["lint", "remake:test", "remake:test-tm", "remake:test-amd64", "wasm:test"]

[tasks.hooks]
description = "Use the hooks of .githooks (pre-commit builds and vets the staged remake)"
run = "git config core.hooksPath .githooks"

# --- Release -----------------------------------------------------------------

# Releases only go through the GitHub workflow: it bumps VERSION, tags the commit
# and pushes both images. Building and pushing locally would leave VERSION changed
# without a commit or tag.
[tasks.release]
description = "Start the release workflow (optional version, default: next patch)"
usage = 'arg "[version]" help="Release version, e.g. 5.2.0"'
run = 'gh workflow run release.yml ${usage_version:+-f version=$usage_version}'
