<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Readiness</title>
<style>
  :root {
    --bg: #f6f6f3; --surface: #ffffff; --surface-2: #fafaf8; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e2e2dc; --accent: #2f5bd3; --accent-bg: #e8eefc; --pass: #18703d; --fail: #c4372d;
    --skip: #5f5f59; --pass-bg: #e6f4ec; --fail-bg: #fbe9e7; --skip-bg: #efefeb;
    --warn: #8a5200; --warn-bg: #fdf1dc; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #232321; --text: #ecece8; --muted: #9a9a93;
      --line: #33332f; --accent: #7d9bff; --accent-bg: #1f2740; --pass: #4cc483; --fail: #ff7a6e;
      --skip: #8a8a82; --pass-bg: #17301f; --fail-bg: #3a1d1a; --skip-bg: #262624;
      --warn: #f0b45a; --warn-bg: #3a2c14; --on-accent: #10131c; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #232321; --text: #ecece8; --muted: #9a9a93;
    --line: #33332f; --accent: #7d9bff; --accent-bg: #1f2740; --pass: #4cc483; --fail: #ff7a6e;
    --skip: #8a8a82; --pass-bg: #17301f; --fail-bg: #3a1d1a; --skip-bg: #262624;
    --warn: #f0b45a; --warn-bg: #3a2c14; --on-accent: #10131c; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .key { color: var(--muted); font-size: 12px; }

  header.top { position: sticky; top: 0; z-index: 5; background: var(--surface);
    border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1120px; margin: 0 auto; padding: 12px 16px 0; }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  nav.tabs a { padding: 8px 12px; font-size: 14px; color: var(--muted); text-decoration: none;
    border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  nav.tabs .count { font-size: 11px; background: var(--skip-bg); border-radius: 999px; padding: 0 6px; margin-left: 4px; }

  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  h3 { font-size: 16px; margin: 28px 0 10px; }
  .lead { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px;
    box-shadow: var(--shadow); }
  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  ul.plain { list-style: none; margin: 0; padding: 0; }

  /* Hero and ladder */
  .hero { display: flex; gap: 24px; align-items: flex-start; }
  .hero-text { flex: 1; min-width: 0; }
  .headline { font-size: 17px; margin: 6px 0 16px; max-width: 62ch; }
  .hero .big { font-size: 52px; font-weight: 750; line-height: 1; letter-spacing: -.02em; }
  .hero .name { font-size: 20px; font-weight: 650; }
  .ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
  .step { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
    background: var(--surface-2); cursor: pointer; font-size: 13px; position: relative; }
  .step:hover { border-color: var(--accent); }
  .step.cleared { background: var(--pass-bg); border-color: transparent; }
  .step.na { background: transparent; border-style: dashed; }
  .step.next { border: 2px dashed var(--accent); }
  .step[aria-selected="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .step b { display: block; font-size: 14px; }
  .step .state { font-size: 12px; color: var(--muted); }
  .meter { position: relative; height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: visible; }
  .meter > span { display: block; height: 100%; border-radius: 3px; background: var(--pass); }
  .meter > i { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--text); opacity: .55; }

  .banner { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between;
    background: var(--pass-bg); border-radius: 12px; padding: 14px 20px; margin-top: 24px; color: var(--text); text-decoration: none; }
  .banner:hover { outline: 2px solid var(--pass); }
  .banner b, .banner .go { color: var(--pass); }
  .banner .go { font-weight: 600; }
  .attention { display: grid; gap: 0; padding: 4px 20px; }
  .attention button { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; text-align: left; border: 0;
    border-bottom: 1px solid var(--line); background: transparent; padding: 10px 0; cursor: pointer; min-height: 44px; }
  .attention button:last-child { border-bottom: 0; }
  .attention button:hover b { color: var(--accent); }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .section-head a { font-size: 14px; }
  .gain { margin: 12px 0 0; }
  .agent-use { margin: 10px 0 0; max-width: 62ch; }
  .agent-use .label { display: block; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .agent-use .text { display: block; margin-top: 2px; font-size: 17px; font-weight: 550; line-height: 1.4; }
  .agent-use.locked .label, .agent-use.locked .text { color: var(--muted); }
  .agent-use.locked .text { font-weight: 450; }
  .hero .headline { margin-top: 14px; }
  .persp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 20px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .persp .row-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .persp .row-head span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .persp .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; }
  .persp a { display: block; color: inherit; text-decoration: none; border-radius: 6px; margin: -4px -6px; padding: 4px 6px; }
  .persp a:hover, .persp a:focus-visible { background: var(--accent-bg); }
  .persp a:hover .row-head span:first-child { color: var(--accent); }
  .tag-persp { border-color: var(--muted); color: var(--muted); }
  .persp .bar > span { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
  @media (max-width: 600px) { .persp { grid-template-columns: 1fr; } }

  /* Criterion items */
  .item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
  .item:hover { border-color: var(--accent); }
  .item + .item { margin-top: 8px; }
  .grid > .item + .item { margin-top: 0; }
  .item .body { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .item .fix { font-size: 13.5px; margin-top: 4px; }
  .item .why { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .item .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .item .note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .item.clamp .why { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  div.item { cursor: default; }
  .link { border: 0; background: transparent; padding: 0 2px; color: var(--accent); cursor: pointer; font-size: 13px; }
  .link:hover { text-decoration: underline; }
  .item input[type="checkbox"] { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
  .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-bg); color: var(--accent);
    display: grid; place-items: center; font-weight: 700; font-size: 13px; }

  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
    white-space: nowrap; border: 1px solid transparent; }
  .pass { background: var(--pass-bg); color: var(--pass); }
  .fail { background: var(--fail-bg); color: var(--fail); }
  .skipped { background: var(--skip-bg); color: var(--skip); }
  .e-trivial { background: var(--pass-bg); color: var(--pass); }
  .e-small { background: var(--accent-bg); color: var(--accent); }
  .e-medium { background: var(--warn-bg); color: var(--warn); }
  .e-large { background: var(--fail-bg); color: var(--fail); }
  .e-none { background: var(--skip-bg); color: var(--skip); }
  .tag-prio { border-color: var(--accent); color: var(--accent); }
  .tag-critical { border-color: var(--fail); color: var(--fail); font-weight: 600; }
  .tag-lvl { background: var(--skip-bg); color: var(--muted); }
  .tag-waived { border-color: var(--muted); color: var(--muted); border-style: dashed; }
  .tag-review { background: var(--warn-bg); color: var(--warn); }
  .tag-new { background: var(--accent-bg); color: var(--accent); }
  .tag-strength { background: var(--pass-bg); color: var(--pass); }

  /* Level detail */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px;
    cursor: pointer; font-size: 14px; }
  .seg button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .seg button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--skip); }
  .seg button .dot.ok { background: var(--pass); }
  .level-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .bigmeter { height: 12px; margin-top: 12px; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .cols { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; align-items: start; }
  .col h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  details.more { margin-top: 16px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px;
    font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip[class*="ch-"]::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: 1px; }
  .chip.ch-pass::before { background: var(--pass); }
  .chip.ch-fail::before { background: var(--fail); }
  .chip.ch-skip::before { background: var(--skip); }
  .chip.ch-warn::before { background: var(--warn); }
  .drop { color: var(--fail); font-weight: 600; }

  /* Heat matrix */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .heat td.c { text-align: center; padding: 4px; }
  .heat button { width: 100%; border: 0; border-radius: 6px; padding: 6px 4px; cursor: pointer; font-size: 13px; }
  .heat .none { color: var(--muted); }
  .heat th.c { text-align: center; }
  .heat .h-pass { background: var(--pass-bg); color: var(--pass); }
  .heat .h-warn { background: var(--warn-bg); color: var(--warn); }
  .heat .h-fail { background: var(--fail-bg); color: var(--fail); }
  .heat .h-skip { background: var(--skip-bg); color: var(--skip); }
  .heat button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .scroll { overflow-x: auto; }

  /* Filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filters select, .filters input, .filters button { font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .filters input { flex: 1; min-width: 180px; }
  .filters button { cursor: pointer; }
  .filters button .n { margin-left: 6px; font-size: 12px; opacity: .75; }
  .filters .plus { border-style: dashed; }
  .filters .plus[aria-pressed="true"] { border-style: solid; }
  .filters .link { border: 0; background: transparent; color: var(--accent); padding: 6px 4px; }
  .preset-caption { font-size: 13px; margin: -6px 0 12px; }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .group-title { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; }

  /* Plan */
  .prompt { width: 100%; min-height: 110px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 12px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); resize: vertical; }
  .btn { display: inline-flex; align-items: center; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn-lg { padding: 10px 18px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .route { margin-bottom: 18px; }
  details.group { margin-top: 14px; }
  details.group > summary { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; cursor: pointer; padding: 6px 0;
    list-style: none; font-size: 13px; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: "▸"; color: var(--muted); }
  details.group[open] > summary::before { content: "▾"; }
  details.group > summary .group-title { margin: 0; }
  .plan-row + .plan-row { margin-top: 8px; }
  .plan-row.waiving .item { border-style: dashed; }
  .plan-row.waiving .item .name { color: var(--muted); }
  .switch { flex: none; align-self: center; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; min-height: 32px; }
  .switch:hover { border-color: var(--warn); color: var(--warn); }
  .switch[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); font-weight: 600; }
  .waive-fields { display: grid; gap: 8px; margin: 6px 0 4px 40px; font-size: 13px; }
  .waive-fields[hidden], .decider[hidden], .prompt-panel[hidden] { display: none; }
  .waive-fields label { display: grid; gap: 4px; color: var(--muted); }
  .waive-fields textarea, .waive-fields input, .decider input { font: inherit; font-size: 14px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .waive-fields textarea { min-height: 56px; resize: vertical; }
  .waive-fields input[type="date"] { justify-self: start; }
  .decider { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .actionbar { position: sticky; bottom: 0; z-index: 4; margin: 24px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 16px rgba(0,0,0,.08); }
  .bar-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bar-info { display: grid; gap: 2px; font-size: 14px; min-width: 0; }
  .bar-info .hint, .bar-info [role="status"] { font-size: 13px; }
  .hint { color: var(--warn); }
  .hint:empty, .bar-info [role="status"]:empty { display: none; }
  .prompt-panel { margin-bottom: 10px; }

  /* Pager */
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 16px;
    border-top: 1px solid var(--line); }
  .pager a { text-decoration: none; font-weight: 600; }
  .pager small { display: block; color: var(--muted); font-weight: 400; }

  /* Dialog */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(720px, calc(100vw - 32px));
    background: var(--surface); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; }
  .dlg-body { padding: 4px 20px 20px; max-height: 70vh; overflow: auto; }
  .dlg-body h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  .dlg-body p { margin: 0; }
  .ev div + div { margin-top: 6px; }
  .close:focus:not(:focus-visible) { outline: none; }
  .close { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }

  @media (max-width: 860px) {
    .g2, .g3, .cols { grid-template-columns: 1fr; }
    .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    nav.tabs { mask-image: linear-gradient(to right, #000 85%, transparent); }
    .seg button, .filters select, .filters input, .filters button, .btn { min-height: 44px; }
    .switch { min-height: 44px; }
    .bar-row .row { width: 100%; }
    .bar-row .row .btn:last-child { flex: 1; justify-content: center; }
  }
  @media (max-width: 600px) {
    .hero { gap: 14px; }
    .headline { font-size: 15.5px; }
    .item:has(.switch) { flex-wrap: wrap; }
    .item:has(.switch) .body { flex: 1 1 200px; }   /* the switch wraps below the text instead of squeezing it */
    .item .switch { margin-left: auto; }
    nav.tabs a { padding: 8px 9px; }
    .waive-fields { margin-left: 0; }
    .hero .big { font-size: 40px; }
    .ladder { grid-template-columns: 1fr; gap: 6px; }
    .step { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: baseline; }
    .step .state { grid-column: 2; grid-row: 1; }
    .step > .muted, .step .meter { grid-column: 1 / -1; }
  }
</style>
</head>

  const strong = Object.fromEntries((s.strengths || []).map(x => [x.key, x]));
  const EFFORTS = ["trivial", "small", "medium", "large", null];
  const EFFORT_LABEL = { trivial: "Trivial effort", small: "Small effort", medium: "Medium effort", large: "Large effort", null: "Not estimated" };
  const fails = results.filter(r => r.status === "fail");
  const pursued = fails.filter(r => !r.waiver);   // waived gaps count in the level but are not planned

  // Level states, needed passes, cost order, quick wins and the build command come from report.py; this view only renders them.

  const target = s.levels.find(l => l.state === "next") || null;
  const neededAt = l => l.needed;   // null when the level fails on coverage
  const byCost = (a, b) => a.cost_rank - b.cost_rank;
  const openQuestions = (data.questions || []).filter(q => q.answer == null);
  const criticalGaps = (s.critical_gaps || []).map(k => byKey[k]).filter(Boolean);
  const PERSPECTIVE_LABEL = { agent: "Agent-ready", architecture: "Architecture-ready", governance: "Governance-ready" };

  // ---------- Helpers ----------
  function el(tag, attrs, ...children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat(Infinity)) {

    };
    const waiveLine = c => {
      if (!c.waive.length && !c.end.length) return null;
      const record = c.waive.map(k => k + " – \"" + infoOf(k).reason.trim() + "\" (review by " + infoOf(k).review_by + ")");
      return s.waive_command + (record.length ? " Record: " + record.join("; ") + "." + (decidedBy.trim() ? " Decided by " + decidedBy.trim() + "." : "") : "") +
        (c.end.length ? " End: " + c.end.join(", ") + "." : "");
    };

    // One row per open gap: a box to build it (when harness-build covers it) and a switch to not pursue it
    const row = r => {
      const info = infoOf(r.key);
      const fields = el("div", { class: "waive-fields", hidden: true },
        el("label", {}, "Why the team does not pursue it",
          el("textarea", { rows: 2, required: true, minlength: start.min_reason, "aria-label": "Reason for not pursuing " + r.name,
            oninput: e => { info.reason = e.target.value; update(); } }, info.reason)),
        el("label", {}, "Review by",
          el("input", { type: "date", required: true, value: info.review_by, min: today, "aria-label": "Review date for " + r.name,
            oninput: e => { info.review_by = e.target.value; update(); } })));
      const box = buildable.has(r.key) ? el("input", { type: "checkbox", "aria-label": "Build " + r.name,
        onchange: e => { e.target.checked ? buildSelection.add(r.key) : buildSelection.delete(r.key); update(); } }) : null;
      const toggle = el("button", { type: "button", class: "switch", "aria-pressed": "false", title: "The team decides not to pursue this gap",
        onclick: () => {
          waiveSelection.has(r.key) ? waiveSelection.delete(r.key) : waiveSelection.add(r.key);
          update();
          if (waiveSelection.has(r.key)) fields.querySelector("textarea").focus();
        } }, "Don't pursue");
      const node = el("div", { class: "plan-row" },
        item(r, { check: box, extra: toggle, why: false, number: routeNo[r.key],
          note: box ? null : "Older report: open it again with report.py --render to plan this gap." }), fields);
      rows[r.key] = { box, toggle, fields, node };
      return node;
    };
    const sorted = pursued.slice().sort((a, b) => a.level - b.level || byCost(a, b));
    // One group per level, so every gap shows the level it belongs to; the next and the reached levels say so
    const groups = s.levels.map(l => ({
      title: "Level " + l.level + " – " + l.name + (tl === l.level ? " · next level" : tl && l.level < tl ? " · reached" : ""),
      rs: sorted.filter(r => r.level === l.level), open: true,
    })).filter(g => g.rs.length);
    const groupNodes = groups.map(g => {
      const nodes = g.rs.map(row);
      const touched = g.rs.some(r => buildSelection.has(r.key) || waiveSelection.has(r.key));
      return el("details", { class: "group", open: g.open || touched ? true : null },
        el("summary", {}, el("span", { class: "group-title" }, g.title),
          el("span", { class: "muted" }, plural(g.rs.length, "gap", "gaps"))),
        nodes);
    });
    const endRows = waived.map(r => {
      const box = el("input", { type: "checkbox", "aria-label": "Pursue " + r.name + " again",
        onchange: e => { e.target.checked ? endSelection.add(r.key) : endSelection.delete(r.key); update(); } });
      rows["end:" + r.key] = { box };
      return item(r, { check: box, fix: false, why: r.waiver.reason });
    });

    // Preselection: one base (cheapest route, all of the next level, quick wins, everything) and, for the first
    // two, "+ reached levels" on top. Which base and whether the plus is on follow from the selection itself.
    const range = (a, b) => a === b ? "L" + a : "L" + a + "–L" + b;
    const same = keys => keys.length === buildSelection.size && keys.every(k => buildSelection.has(k));
    const union = (...lists) => [...new Set(lists.flat())];
    const routeKeys = route.filter(k => buildable.has(k)), levelKeys = sel.target, reachedKeys = sel.below;
    const bases = [
      ["route", routeKeys, tl && "Cheapest route to L" + tl, true],
      ["level", levelKeys, tl && "All of L" + tl, true],
      ["quick", sel.quick_wins, "Quick wins", false],
      ["all", sel.all, "Everything", false],
    ].filter(([, keys, label]) => label && keys.length);
    let plusOn = reachedKeys.length > 0;   // remembered while the selection is picked by hand
    const current = () => {
      for (const [id, keys, , plusable] of bases) {
        if (same(keys)) return { id, plus: false };
        if (plusable && reachedKeys.length && same(union(keys, reachedKeys))) return { id, plus: true };
      }
      return null;
    };
    const choose = id => () => {
      const [, keys, , plusable] = bases.find(b => b[0] === id);
      buildSelection = new Set(plusable && plusOn ? union(keys, reachedKeys) : keys);
      update();
    };
    const togglePlus = () => {
      plusOn = !plusOn;
      const c = current(), base = c && bases.find(b => b[0] === c.id && b[3]) ? c.id : "level";
      choose(bases.some(b => b[0] === base) ? base : bases[0][0])();
    };
    const count = n => el("span", { class: "n" }, n);
    const baseBtns = bases.map(([id, keys, label]) => [id,
      el("button", { type: "button", "aria-pressed": "false", onclick: choose(id) }, label, count(keys.length))]);
    const plusBtn = tl > 1 && reachedKeys.length ? el("button", { type: "button", class: "plus", "aria-pressed": "false",
      title: "Add the open gaps in " + range(1, tl - 1) + ", the levels already reached", onclick: togglePlus },
      "+ reached levels", count(reachedKeys.length)) : null;
    const clear = el("button", { type: "button", class: "link", onclick: () => { buildSelection = new Set(); update(); } }, "Clear");
    const presetCaption = el("p", { class: "muted preset-caption" });
    const caption = () => {
      const n = buildSelection.size;
      if (!n) return "Nothing selected; pick an option or tick the gaps one by one.";
      const head = plural(n, "gap", "gaps") + " selected";
      if (!routeKeys.length) return head + ".";
      if (routeKeys.every(k => buildSelection.has(k)))
        return head + (same(routeKeys) ? ": the cheapest way to clear L" + tl + "."
          : "; the " + (routeKeys.length === 1 ? "numbered one is" : routeKeys.length + " numbered ones are") + " enough to clear L" + tl + ".");
      return head + "; to clear L" + tl + ", include the numbered ones.";
    };
    const filters = el("div", {},
      el("div", { class: "filters", role: "group", "aria-label": "Select gaps to build" },
        baseBtns.filter(([id]) => bases.find(b => b[0] === id)[3]).map(([, btn]) => btn), plusBtn,
        baseBtns.filter(([id]) => !bases.find(b => b[0] === id)[3]).map(([, btn]) => btn), clear),
      presetCaption);

    const decider = served ? el("label", { class: "decider", hidden: true }, "Waivers decided by",
      el("input", { type: "text", value: decidedBy, "aria-label": "Who decided not to pursue these gaps",
        oninput: e => { decidedBy = e.target.value; update(); } })) : null;
    const copyTo = async btn => {
      try { await navigator.clipboard.writeText(prompt.value); }
      catch (e) { promptPanel.hidden = false; prompt.select(); document.execCommand("copy"); }
      btn.textContent = "Copied ✓";
      setTimeout(() => { btn.textContent = "Copy prompt"; }, 1600);
    };
    const copy = el("button", { class: served ? "btn ghost" : "btn", type: "button", "aria-live": "polite", onclick: () => copyTo(copy) }, "Copy prompt");
    // Start build hands the selection to the agent waiting in `report.py --serve`; it runs once, then the agent takes over
    const send = async () => {
      const c = chosen();
      const waive = c.waive.map(k => ({ key: k, reason: infoOf(k).reason.trim(), review_by: infoOf(k).review_by, decided_by: decidedBy.trim() }));
      startBtn.disabled = true;
      try {
        const res = await fetch("/start", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: start.token, build: c.build, waive, end: c.end }) });
        const answer = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error((answer.errors || []).join("; ") || "HTTP " + res.status);
        sent = true;
        try { localStorage.removeItem(storeKey); } catch (e) { /* nothing stored */ }
        startBtn.textContent = "Sent ✓";
        status.textContent = (c.waive.length || c.end.length ? "Waivers recorded in docs/agent-readiness/waivers.json. " : "") +
          (c.build.length ? "Back to the agent session: it plans the build and asks before changing anything." : "Back to the agent session.");
      } catch (e) {
        startBtn.disabled = false;
        status.textContent = "The agent is no longer waiting (" + e.message + "). Copy the prompt into the agent session instead.";
      }
    };
    const startBtn = served ? el("button", { class: "btn", type: "button", onclick: send }, "Start build") : null;
    const promptPanel = el("div", { class: "prompt-panel", hidden: true }, prompt);
    const promptToggle = el("button", { type: "button", class: "btn ghost", "aria-expanded": "false",
      onclick: e => { promptPanel.hidden = !promptPanel.hidden; e.currentTarget.setAttribute("aria-expanded", String(!promptPanel.hidden)); } }, "Prompt");

    function update() {
      const c = chosen(), missing = problems(c);
      // The waiver line comes first: harness-audit records the waivers, then starts harness-build on the line after it.
      const lines = [waiveLine(c), c.build.length ? s.build_command + c.build.join(", ") : null];
      prompt.value = lines.filter(Boolean).join("\n") || "Select at least one gap.";
      counter.textContent = plural(c.build.length, "gap", "gaps") + " to build" +
        (c.waive.length ? " · " + c.waive.length + " not pursued" : "") + (c.end.length ? " · " + c.end.length + " pursued again" : "");
      hint.textContent = missing.length ? "Still needed: " + missing.join("; ") + "." : "";
      const off = (!c.build.length && !c.waive.length && !c.end.length) || missing.length > 0;
      copy.disabled = off;
      if (startBtn && !sent) startBtn.disabled = off;
      for (const [k, x] of Object.entries(rows)) {
        if (k.startsWith("end:")) { x.box.checked = endSelection.has(k.slice(4)); continue; }
        const waiving = waiveSelection.has(k);
        x.node.classList.toggle("waiving", waiving);
        x.toggle.setAttribute("aria-pressed", String(waiving));
        x.toggle.textContent = waiving ? "Not pursued ✓" : "Don't pursue";
        x.fields.hidden = !waiving;
        if (x.box) { x.box.disabled = waiving; x.box.checked = buildSelection.has(k) && !waiving; }
      }
      if (decider) decider.hidden = !c.waive.length;
      const cur = current();
      if (cur && bases.find(b => b[0] === cur.id)[3]) plusOn = cur.plus;
      baseBtns.forEach(([id, btn]) => btn.setAttribute("aria-pressed", String(!!cur && cur.id === id)));
      if (plusBtn) {
        const plusable = !cur || bases.find(b => b[0] === cur.id)[3];
        plusBtn.setAttribute("aria-pressed", String(!!cur && cur.plus));
        plusBtn.disabled = !plusable;
        plusBtn.title = plusable ? "Add the open gaps in " + range(1, tl - 1) + ", the levels already reached"
          : "Quick wins and everything already include the reached levels";
      }
      presetCaption.textContent = caption();
      refreshPlanCount();
      if (!sent) save();
    }
    update();

    return [
      el("h2", {}, "Plan the next step"),
      el("p", { class: "lead" }, served
        ? "Tick the gaps harness-build should close, mark the ones the team will not pursue, and press Start build. harness-build plans first and asks before changing anything; it commits nothing."
        : "Tick the gaps harness-build should close and mark the ones the team will not pursue. Copy the prompt into the agent session that ran the audit; harness-build plans first and asks before changing anything."),
      target ? el("div", { class: "card route" },
        el("div", { class: "level-head" },
          el("b", {}, "Level " + target.level + " – " + target.name),
          el("span", { class: "muted" }, target.failed_condition === "coverage" ? target.evaluated + " of " + target.total + " assessed"
            : target.passed + " of " + target.clears_at + " passing · " + neededAt(target) + " more to go")),
        meter(target, true),
        el("p", { class: "muted", style: "margin:10px 0 0;font-size:13.5px" }, target.failed_condition === "coverage"
          ? "Too few criteria at this level could be assessed; answer the open questions on the Context view first."
          : route.length === 1 ? "The gap numbered 1 is the cheapest route: it alone clears the level."
            : "The numbered gaps are the cheapest route: these " + route.length + " together clear the level.")) : null,
      filters,
      decider,
      groupNodes,
      waived.length ? el("details", { class: "group" },
        el("summary", {}, el("span", { class: "group-title" }, "Already not pursued"), el("span", { class: "muted" }, "tick one to pursue it again")),
        endRows) : null,
      el("div", { class: "actionbar" },
        promptPanel,
        el("div", { class: "bar-row" },
          el("div", { class: "bar-info" }, counter, hint, status),
          el("div", { class: "row" }, promptToggle, copy, startBtn))),
    ];
  }

  const EMPTY_FILTER = { status: "", level: "", category: "", perspective: "", effort: "", query: "" };
  let criteriaFilter = { ...EMPTY_FILTER };
  function viewCriteria(arg) {
    if (arg && PERSPECTIVE_LABEL[arg]) criteriaFilter = { ...EMPTY_FILTER, perspective: arg };
    const f = criteriaFilter;
    const listBox = el("div");
    const countBox = el("span", { class: "muted" });
    const cells = [];
    // Category × level: passed of assessed, as report.py counts; a cell filters the list below
    const cell = (cat, lv) => {
      const rs = results.filter(r => r.category === cat.id && (lv == null || r.level === lv) && (!f.perspective || r.perspective === f.perspective));
      const ev = rs.filter(r => r.status === "pass" || r.status === "fail");
      const p = ev.filter(r => r.status === "pass").length;
      if (!rs.length) return el("td", { class: "c" }, el("span", { class: "none" }, "·"));
      const rate = ev.length ? p / ev.length : null;
      const tone = rate == null ? "skip" : rate >= 0.75 ? "pass" : rate >= 0.5 ? "warn" : "fail";
      const btn = el("button", { type: "button", class: "h-" + tone, "aria-pressed": "false",
        title: cat.name + (lv ? " · L" + lv : "") + ": " + p + " of " + ev.length + " assessed pass",
        onclick: () => {
          const same = f.category === cat.id && f.level === (lv == null ? "" : String(lv));
          f.category = same ? "" : cat.id; f.level = same || lv == null ? "" : String(lv);
          syncSelects(); rerender();
        } }, p + " / " + ev.length);
      cells.push([btn, cat.id, lv == null ? "" : String(lv)]);
      return el("td", { class: "c" }, btn);
    };
    const matrix = el("div", { class: "card scroll" });
    // The table follows the perspective filter, so it shows where that perspective's gaps sit
    const buildMatrix = () => {
      cells.length = 0;
      matrix.replaceChildren(el("table", { class: "heat" },
        el("thead", {}, el("tr", {}, el("th", {}, "Category"), s.levels.map(l => el("th", { class: "c" }, "L" + l.level)), el("th", { class: "c" }, "All"))),
        el("tbody", {}, s.categories.filter(cat => results.some(r => r.category === cat.id && (!f.perspective || r.perspective === f.perspective))).map(cat =>
          el("tr", {}, el("td", {}, cat.name), s.levels.map(l => cell(cat, l.level)), cell(cat, null))))));
    };
    const selects = {};
    const sel = (key, label, options) => {
      const n = el("select", { "aria-label": label, onchange: e => { f[key] = e.target.value; rerender(); } },
        el("option", { value: "" }, label), options.map(([v, t]) => el("option", { value: v }, t)));
      selects[key] = n;
      return n;
    };
    const syncSelects = () => { for (const [k, n] of Object.entries(selects)) n.value = f[k]; };
    function rerender() {
      const rs = results.filter(r => (!f.status || r.status === f.status) && (!f.level || String(r.level) === f.level) &&
        (!f.category || r.category === f.category) && (!f.perspective || r.perspective === f.perspective) && (!f.effort || (r.effort || "none") === f.effort) &&
        (!f.query || (r.name + " " + r.key + " " + (r.fix || "") + " " + (r.evidence || []).map(e => e.ref + " " + (e.detail || "")).join(" "))
          .toLowerCase().includes(f.query)));
      countBox.textContent = rs.length + " of " + results.length;
      cells.forEach(([btn, cat, lv]) => btn.setAttribute("aria-pressed", String(f.category === cat && f.level === lv)));
      listBox.replaceChildren(...s.categories.flatMap(cat => {
        const inCat = rs.filter(r => r.category === cat.id).sort((a, b) => a.level - b.level);
        return inCat.length ? [el("div", { class: "group-title" }, cat.name + " (" + inCat.length + ")"),
          list(inCat, { status: true, why: false })] : [];
      }));
      if (!rs.length) listBox.append(el("p", { class: "empty" }, "No criterion matches these filters. ",
        el("button", { type: "button", class: "btn ghost", onclick: () => { criteriaFilter = { ...EMPTY_FILTER }; go("criteria"); } }, "Reset filters")));
    }
    const statusButtons = [["", "All"], ["fail", "Failing"], ["pass", "Passing"], ["skipped", "Skipped"]].map(([v, t]) =>
      el("button", { type: "button", "aria-pressed": f.status === v ? "true" : "false", onclick: e => {
        f.status = v; statusButtons.forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget))); rerender(); } }, t));
    const search = el("input", { type: "search", placeholder: "Search name, key, fix, evidence…", "aria-label": "Search criteria",
      value: f.query, oninput: e => { f.query = e.target.value.toLowerCase(); rerender(); } });
    const perspButtons = (s.perspectives ? [["", "All perspectives"], ...s.perspectives.map(p => [p.id, PERSPECTIVE_LABEL[p.id] || p.id])] : []).map(([v, t]) =>
      el("button", { type: "button", "aria-pressed": f.perspective === v ? "true" : "false", onclick: e => {
        f.perspective = v; perspButtons.forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget)));
        history.replaceState(null, "", "#criteria" + (v ? "/" + v : "")); buildMatrix(); rerender(); } }, t));
    const filters = el("div", { class: "filters" }, statusButtons,
      sel("level", "All levels", s.levels.map(l => [String(l.level), "L" + l.level + " " + l.name])),
      sel("category", "All categories", s.categories.map(c => [c.id, c.name])),
      hasEffort ? sel("effort", "Any effort", [["trivial", "Trivial"], ["small", "Small"], ["medium", "Medium"], ["large", "Large"]]) : null,
      search, countBox);
    syncSelects();
    buildMatrix();
    rerender();
    return [
      el("h2", {}, "Criteria"),
      el("p", { class: "lead" }, "Every criterion with its result. The table counts passed of assessed criteria per category and level; " +
        "green from 75 %, amber from 50 %. Click a cell to filter the list, a criterion for its evidence. " +
        "Tags mark the architecture and governance perspectives; untagged criteria belong to the agent perspective."),
      perspButtons.length ? el("div", { class: "filters", role: "group", "aria-label": "Perspective" }, perspButtons) : null,
      matrix,
      el("div", { style: "margin-top:16px" }, filters),
      listBox,
    ];
  }

  function viewContext() {
    const prof = data.profile || {};
    const val = v => Array.isArray(v) ? v.join(", ") : typeof v === "boolean" ? (v ? "yes" : "no") : String(v);
    const c = s.comparison;
    // A coloured dot per kind of change; the label says it too, so colour is never the only signal
    const changed = (label, keys, kind) => keys && keys.length ? el("div", { style: "margin-top:8px" }, el("b", {}, label + ": "),
      el("div", { class: "chips" }, keys.map(k => {
        const n = byKey[k] ? chip(byKey[k]) : el("span", { class: "chip" }, k);
        if (kind) n.classList.add("ch-" + kind);
        return n;
      }))) : null;
    return [
      el("h2", {}, "Context"),
      el("p", { class: "lead" }, "What the assessment knew about the repository, and what is still open."),
      openQuestions.length ? [el("h3", {}, "Open questions"), el("p", { class: "lead" }, "Answering these lets the next run assess the criteria behind them."),
        el("div", {}, openQuestions.map(q => item(byKey[q.key] || { key: q.key, name: q.key, level: "?" },
          { why: q.question, fix: false })))] : null,
      (data.questions || []).some(q => q.answer != null) ? [el("h3", {}, "Answered questions"), el("div", { class: "card" },
        el("ul", { style: "margin:0;padding-left:18px" }, data.questions.filter(q => q.answer != null).map(q =>
          el("li", {}, q.question, " ", el("code", { class: "key" }, q.key), el("div", { class: "muted" }, "Answer: " + q.answer)))))] : null,
      c ? [el("h3", {}, "Changes since " + c.previous_date), el("div", { class: "card" },
        el("p", { style: "margin:0" }, "Level " + c.level_before + " → " + s.level,
          s.level < c.level_before ? el("span", { class: "drop" }, " · level dropped") : null),
        c.skill_version_before && c.skill_version_before !== data.skill_version
          ? el("p", { class: "muted" }, "Skill version changed (" + c.skill_version_before + " → " + data.skill_version +
              "); some differences may come from the catalog, not the repo.") : null,
        changed("Newly passed", c.newly_passed, "pass"), changed("Newly failed", c.newly_failed, "fail"),
        changed("Newly skipped", c.newly_skipped, "skip"), changed("Newly assessed and failing", c.newly_assessed, "fail"),
        changed("Catalog changes", c.catalog_changes), changed("Newly waived", c.newly_waived, "warn"),
        changed("Waivers ended", c.waivers_ended))] : null,
      waived.length ? [el("h3", {}, "Not pursued"), el("p", { class: "lead" }, "Waived by the team: graded as usual and counted in the level, but left out of the priorities, quick wins, and the build."),
        el("div", {}, waived.map(r => item(r, { why: r.waiver.reason + " (" + r.waiver.decided_by + ", " + r.waiver.date +
          "; review by " + r.waiver.review_by + ")", fix: false, status: true })))] : null,
      (data.notes || []).length ? [el("h3", {}, "Notes"), el("div", { class: "card" },
        el("ul", { style: "margin:0;padding-left:18px" }, data.notes.map(n => el("li", {}, rich(n)))))] : null,
      el("h3", {}, "Repository profile"),
      el("div", { class: "card scroll" }, el("table", {}, el("tbody", {},
        Object.entries(prof).map(([k, v]) => el("tr", {}, el("th", { style: "width:220px" }, k.replace(/_/g, " ")), el("td", {}, val(v))))))),
    ];
  }

  // ---------- Routing ----------
  function go(route, anchor) {
    const hash = "#" + route;
    pendingAnchor = anchor || null;
    if (location.hash === hash) render(); else location.hash = hash;
  }
  let pendingAnchor = null;
  function render() {
    const [id, arg] = (location.hash.slice(1) || "overview").split("/");
    const alias = ALIASES[id] || (id === "plan" && !hasPlan ? "overview" : null);
    if (alias) { location.replace("#" + alias + (arg && alias === "levels" ? "/" + arg : "")); return; }
    const view = VIEWS.find(v => v.id === id) || VIEWS[0];
    renderTop(view.id);
    app.replaceChildren(...[view.render(arg || pendingAnchor)].flat(Infinity).filter(Boolean), pager(view.id));
    if (!pendingAnchor) window.scrollTo(0, 0);
    pendingAnchor = null;
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
