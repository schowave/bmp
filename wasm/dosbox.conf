# DOSBox configuration for js-dos (WASM/Browser)

[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=original
output=surface
autolock=false
sensitivity=100
waitonerror=false
priority=higher,normal
usescancodes=true

[dosbox]
machine=svga_s3
memsize=4

[render]
frameskip=0
aspect=true
scaler=none

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=10
cycledown=20

[mixer]
nosound=false
rate=44100
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=44100
tandy=auto
tandyrate=44100

[joystick]
joysticktype=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=auto

[ipx]
ipx=false

[autoexec]
@echo off
mount c .
# D: zeigt auf ein Unterverzeichnis derselben Ablage. Der Slot friert den ganzen
# Datentraeger ein, D: ist also genauso dauerhaft wie C:. Der Sinn ist Einheitlichkeit:
# in der VNC-Variante ist D: das persistente Laufwerk und C: fluechtig, hier gilt nun
# dieselbe Anweisung "speichere auf D:" statt zwei verschiedene.
c:
# Das Verzeichnis kann fehlen, wenn ein aelterer Spielstand wiederhergestellt wird, der
# vor seiner Einfuehrung entstanden ist. Dann scheitert der Mount stillschweigend, es
# gibt kein D:, und im Spiel ist der Knopf tot. Also vorher anlegen.
IF NOT EXIST SAVES\NUL MD SAVES
mount d ./SAVES
# START.BAT startet das Spiel neu, sobald es beendet wird, und meldet das Ende
# ueber die DOS-Konsole, worauf die Seite sofort den Spielstand hochlaedt.
START.BAT
