services:
  bmp:
    image: schowave/bmp:wasm
    container_name: bmp-wasm
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      # Unlike vnc/docker-compose.yml (./savegame), a fixed path on the Synology,
      # because the existing saves live there. Adjust it on another host, e.g.
      # ./savegame:/data. Whoever changes the path must move the .sav files along,
      # otherwise every slot starts empty.
      - /volume1/docker/bmp-saves:/data
    # The server runs unprivileged as uid 1000 and has to write to /data. As in
    # vnc/docker-compose.yml it therefore runs in group 100 (users on Synology),
    # which the folder's ACL grants write access. On another host, use the group
    # that owns the directory, or run chown -R 1000:1000 on it.
    group_add:
      - "100"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
