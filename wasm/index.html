<!DOCTYPE html>
<html lang="de">
<head>
    <title>Bundesliga Manager Professional</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="utf-8">
    <style>
        body { margin: 0; background-color: #1a1a1a; height: 100%; display: flex; flex-direction: column; }
        html { height: 100%; }
        #jsdos { flex: 1; overflow: hidden; }
        #version { position: fixed; bottom: 4px; right: 8px; color: rgba(255,255,255,0.3); font: 11px monospace; z-index: 10; pointer-events: none; }
        #slot { pointer-events: auto; user-select: all; cursor: text; }
        #hilfe { pointer-events: auto; color: rgba(255,255,255,0.45); }

        #loader { position: fixed; inset: 0; z-index: 20; background: #1a1a1a; color: #e8e8e8;
                  display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 26px; font: 14px/1.7 system-ui, -apple-system, sans-serif; transition: opacity .3s ease; }
        #loader.done { opacity: 0; pointer-events: none; }
        #loader-spinner { width: 38px; height: 38px; border-radius: 50%;
                          border: 3px solid rgba(255,255,255,.15); border-top-color: #e8e8e8;
                          animation: loader-spin 1s linear infinite; }
        @keyframes loader-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #loader-spinner { animation: none; } }
        #loader-title { font-size: 17px; letter-spacing: .04em; }
        #loader-phases { list-style: none; margin: 0; padding: 0; min-width: 14em; }
        #loader-phases li { color: rgba(255,255,255,.3); }
        #loader-phases li::before { content: "\25CC  "; }
        #loader-phases li.active { color: #e8e8e8; }
        #loader-phases li.done { color: rgba(255,255,255,.5); }
        #loader-phases li.done::before { content: "\25CF  "; }
        #loader-hint { font-size: 12px; color: rgba(255,255,255,.28); }
        #loader.failed #loader-spinner { animation: none; border-top-color: #f87171; }
        #loader-error { display: none; color: #f87171; max-width: 26em; text-align: center; }
        #loader.failed #loader-error { display: block; }
        #loader.failed #loader-phases { display: none; }
    </style>
    <!-- Pinned to a fixed js-dos version. The official CDN only offers /latest/,
         which moves out from under the project; jsDelivr serves the same files
         byte for byte from the npm package. When upgrading, keep in mind that the
         guard in patchFrameLines() wraps a js-dos internal. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/js-dos.css">
    <script src="https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/js-dos.js"></script>
</head>

<body>
    <div id="jsdos"></div>
    <div id="version"></div>

    <div id="loader">
        <div id="loader-spinner"></div>
        <div id="loader-title">Bundesliga Manager Professional</div>
        <ol id="loader-phases" role="status" aria-live="polite">
            <li></li><li></li><li></li>
        </ol>
        <div id="loader-error"></div>
        <div id="loader-hint">Der erste Start dauert einen Moment.</div>
    </div>

    <script>
        // The loading screen covers the DOSBox boot until the game draws its first
        // frame. Without it, you see nothing but the DOS startup messages for almost a
        // minute and take the page for broken.
        const loader = (() => {
            const el = document.getElementById("loader");
            const items = Array.from(document.querySelectorAll("#loader-phases li"));
            const labels = [
                ["Spieldaten laden …", "Spieldaten geladen"],
                ["Emulator starten …", "Emulator gestartet"],
                ["Spiel startet …", "Spiel gestartet"],
            ];
            let hidden = false;

            const phase = (index) => {
                items.forEach((li, i) => {
                    li.textContent = labels[i][i < index ? 1 : 0];
                    li.classList.toggle("done", i < index);
                    li.classList.toggle("active", i === index);
                });
            };

            const hide = () => {
                if (hidden) return;
                hidden = true;
                el.classList.add("done");
                setTimeout(() => el.remove(), 400);
            };

            const fail = (message) => {
                if (hidden) return;
                el.classList.add("failed");
                document.getElementById("loader-error").textContent = message;
                document.getElementById("loader-hint").textContent = "Klicken, um Details zu sehen.";
            };

            el.addEventListener("click", hide);   // escape hatch in case something hangs after all
            setTimeout(() => {
                if (!hidden && !el.classList.contains("failed")) {
                    document.getElementById("loader-hint").textContent =
                        "Das dauert laenger als gewoehnlich. Klicken, um trotzdem zuzusehen.";
                }
            }, 20000);
            phase(0);
            return { phase, hide, fail };
        })();

        // Hides the loading screen as soon as the running DOS program switches the
        // video mode. js-dos sets width and height directly on the canvas. Watching
        // these attributes is the only non-invasive way: ci.events().onFrameSize() is
        // a setter, not a listener; whoever registers there replaces the renderer of
        // js-dos.
        function hideOnVideoModeChange() {
            const root = document.getElementById("jsdos");

            const watch = (canvas) => {
                const size = () => canvas.width + "x" + canvas.height;
                // A fresh canvas is at the browser default of 300x150. Only the first
                // real size is the DOS text mode, the next one is the game.
                const isReal = () => canvas.width > 0 && size() !== "300x150";
                let baseline = isReal() ? size() : null;

                new MutationObserver((_, obs) => {
                    if (!isReal()) return;
                    if (baseline === null) { baseline = size(); return; }
                    if (size() !== baseline) { obs.disconnect(); loader.hide(); }
                }).observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });
            };

            const canvas = root.querySelector("canvas");
            if (canvas) { watch(canvas); return; }

            new MutationObserver((_, obs) => {
                const late = root.querySelector("canvas");
                if (late) { obs.disconnect(); watch(late); }
            }).observe(root, { childList: true, subtree: true });
        }

        // js-dos delivers only bnd-play, ci-ready, emu-ready and fullscreen-change
        // to onEvent. There is no error event: bnd-error and emu-error are merely
        // internal states. A missing bundle would thus leave the loading screen up
        // forever, hence these two safeguards.
        const BUNDLE = "bmp.jsdos";

        // Every visitor gets their own save slot. Before, a single slot for everyone
        // lived under /api/saves/bmp: whoever opened the page loaded the last player's
        // state and overwrote it on the next save.
        //
        // ?slot=<name> sets the slot and remembers it. That covers three cases:
        // continuing the old shared state (?slot=bmp), recovering a lost slot, and
        // continuing the same state on a second device.
        //
        // An identifier is not a login. Whoever knows it can read and overwrite this
        // state; with the random identifiers that hardly matters, with a self-chosen
        // name it does.
        const SLOT_MUSTER = /^[A-Za-z0-9_-]{1,64}$/;   // like validName in server.go

        // Readable identifiers instead of a UUID: you can read them out, type them
        // and recognize them, which is the actual purpose with ?slot=.
        //
        // Only nouns, so no adjective endings can go wrong - an earlier version
        // produced names like "stolze-doppelpass". No umlauts, so they pass the
        // pattern above.
        //
        // Four out of fifty without repetition is 50*49*48*47, so about 5.5 million
        // combinations. That means no appended number is needed any more: four words
        // from a short list would not get there, because four digits alone carry the
        // factor 10000. It still stays well below a UUID; whoever probes the
        // interface finds other people's saves. It was never a login anyway.
        const WOERTER = [
            "libero", "stuermer", "torwart", "spielmacher", "verteidiger",
            "kapitaen", "elfmeter", "freistoss", "flanke", "kopfball",
            "doppelpass", "konter", "abseits", "rasen", "tribuene",
            "pokal", "derby", "meister", "aufsteiger", "kabine",
            "anstoss", "eckball", "halbzeit", "mittelfeld", "torlinie",
            "strafraum", "mittelkreis", "seitenlinie", "hattrick", "eigentor",
            "abstoss", "einwurf", "wechselbank", "trainerbank", "flutlicht",
            "stadion", "nordkurve", "suedkurve", "fangesang", "trikot",
            "stollen", "torjaeger", "spielfuehrer", "torschuetze", "vorlage",
            "zuspiel", "graetsche", "dreierkette", "viererkette", "pressing",
        ];

        function neueKennung() {
            const zufall = (grenze) => crypto.getRandomValues(new Uint32Array(1))[0] % grenze;
            const uebrig = WOERTER.slice();
            const teile = [];
            for (let i = 0; i < 4; i++) teile.push(uebrig.splice(zufall(uebrig.length), 1)[0]);
            return teile.join("-");
        }

        // On a first visit, it is checked whether the drawn identifier is already
        // taken: the server answers 404 for a free slot and 200 for a taken one.
        // That covers the case that hurts, because with autosave every used slot
        // becomes visible within a minute.
        //
        // Two limits remain: an identifier that was handed out but never saved is
        // invisible, and checking and claiming are two steps, so two visitors in
        // the same millisecond can draw the same one. With 5.5 million
        // combinations both are unlikely enough not to pay for them with an
        // additional endpoint in the server.
        const SLOT_VERSUCHE = 5;

        let slot = null;
        let SAVE_URL = null;

        async function istBelegt(kennung) {
            try {
                return (await fetch("/api/saves/" + kennung)).ok;
            } catch {
                return false;   // server unreachable: take the identifier anyway
            }
        }

        async function slotErmitteln() {
            const lesen = () => { try { return localStorage.getItem("bmp-slot"); } catch { return null; } };
            const gueltig = (wert) => !!wert && SLOT_MUSTER.test(wert);

            const gewuenscht = new URLSearchParams(location.search).get("slot");
            const gemerkt = lesen();

            // Whoever already has a slot keeps it and is not checked: that it is
            // taken is exactly the point there.
            let gewaehlt = gueltig(gewuenscht) ? gewuenscht : gueltig(gemerkt) ? gemerkt : null;

            if (gewaehlt === null) {
                for (let versuch = 0; versuch < SLOT_VERSUCHE; versuch++) {
                    gewaehlt = neueKennung();
                    if (!await istBelegt(gewaehlt)) break;
                }
            }

            try { localStorage.setItem("bmp-slot", gewaehlt); } catch { /* not available */ }
            return gewaehlt;
        }

        fetch(BUNDLE, { method: "HEAD" })
            .then((r) => { if (!r.ok) loader.fail("Spieldaten sind nicht erreichbar (HTTP " + r.status + ")."); })
            .catch(() => loader.fail("Spieldaten konnten nicht geladen werden."));

        // If the emulator does not come up at all, the loading screen clears the way
        // to whatever js-dos itself shows. As soon as bnd-play is reported, it is
        // running, and this escape hatch is cleared: otherwise, on a slow start, it
        // would uncover exactly the DOS screen it is meant to hide.
        //
        // Generously sized and cleared at the first sign of life. 25 seconds were
        // too short: a cold start over the network loads a 1.2 MB bundle and a 2.5 MB
        // emulator, ci-ready only came after more than 25 seconds, so the escape hatch
        // fired before that and uncovered a black screen while the game was still
        // coming up. The actual safety net against a missing bundle is the HEAD
        // request above, which kicks in immediately.
        const bootTimeout = setTimeout(() => loader.hide(), 90000);

        // js-dos 8.4.1 occasionally crashes on a video mode change. In emulators.js,
        // onFrameSize() reallocates the frame buffer smaller, while onFrameLines()
        // writes to it without checking:
        //
        //   onFrameSize(w, h)  { this.rgb = new Uint8Array(w * h * 3); }
        //   onFrameLines(lines){ for (const l of lines) this.rgb.set(l.heapu8, l.start * this.frameWidth * 3); }
        //
        // Lines the worker still produced for the old, larger mode then write past
        // the end of the buffer: "RangeError: offset is out of bounds", which js-dos
        // shows as "Backend crashed" and which ends the game. BMP switches modes
        // often, so it hits you in the middle of a game.
        //
        // Such a packet is stale anyway, so we discard it and wait for the next
        // frame. The feature check ensures that a future js-dos version at most
        // silently disables the guard instead of breaking.
        function patchFrameLines(ci) {
            if (!ci || typeof ci.onFrameLines !== "function") return;
            const original = ci.onFrameLines.bind(ci);
            ci.onFrameLines = (lines, rgba) => {
                try {
                    return original(lines, rgba);
                } catch (e) {
                    if (e instanceof RangeError) return;   // frame from the old video mode
                    throw e;
                }
            };
        }

        // On its own, js-dos only saves when leaving fullscreen, when releasing the
        // pointer lock and on visibilitychange. Closing the page does nothing, and
        // contrary to an earlier assumption there is no periodic save. So whoever
        // plays and closes the tab loses their progress. js-dos 8.4.1 offers no
        // public save API, but the sidebar does have the class .save-button - a real
        // CSS name, not a minified internal. The feature check lets a future rename
        // fail silently instead of breaking the page.
        //
        // What gets saved is always the file state in the emulator, not the running
        // game state: saves made in the game itself are kept, an unsaved match is
        // not.
        // Since the marker above, the interval is no longer the main path but the
        // crash insurance: saved in the game, kept playing, backend crashes.
        // Without it that state would be lost, even though BMP had already written it.
        const SAVE_INTERVALL_MS = 60000;

        function speichern() {
            const button = document.querySelector(".save-button");
            if (button) button.click();
        }

        // START.BAT in the bundle reports the end of the game over the DOS console.
        // Then save right away instead of waiting up to a minute for the interval:
        // at exactly this moment BMP has freshly written its game state.
        const EXIT_MARKER = "---BMP-BEENDET---";

        function beendenErkennen(ci) {
            try {
                const ereignisse = ci?.events?.();
                if (typeof ereignisse?.onStdout !== "function") return;
                // The previous handler cannot be read out, so it gets replaced.
                // js-dos only uses it for its benchmark window, which nobody opens here.
                ereignisse.onStdout((text) => {
                    if (typeof text === "string" && text.includes(EXIT_MARKER)) speichern();
                });
            } catch { /* not critical, the interval and the background switch still apply */ }
        }

        function speichernEinrichten() {
            setInterval(speichern, SAVE_INTERVALL_MS);
            // In addition, as soon as the page goes to the background - tab switched,
            // window minimized, browser clicked away. The page is still alive here, so
            // the archive gets built completely and the PUT goes through. At pagehide it
            // is too late for that: measured, no request got out there any more, so
            // nothing here hangs off that event.
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) speichern();
            });
        }

        function spielStarten() {
            Dos(document.getElementById("jsdos"), {
                url: BUNDLE,
                // Without pathPrefix, js-dos keeps loading the emulator from /latest/,
                // which would leave emulators.js and wdosbox.wasm unpinned - that is,
                // exactly the file with the bug above. Must match the version in the
                // script tag.
                pathPrefix: "https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/emulators/",
                autoStart: true,
                theme: "dark",
                autoSave: true,
                onEvent: (event, ci) => {
                    if (event === "bnd-play") {
                        clearTimeout(bootTimeout);   // running, the escape hatch is done
                        loader.phase(1);
                    }
                    if (event === "ci-ready") {
                        patchFrameLines(ci);
                        beendenErkennen(ci);
                        speichernEinrichten();
                        loader.phase(2);
                        hideOnVideoModeChange();
                        // Generously sized: a loading screen that stays up too long is more
                        // harmless than one that uncovers the DOS boot. Whoever does not want
                        // to wait clicks it away.
                        setTimeout(loader.hide, 120000);
                    }
                },
                fsChanges: {
                    local: false,
                    pull: async (key) => {
                        const r = await fetch(SAVE_URL);
                        return r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
                    },
                    push: async (key, data) => {
                        // keepalive lets a running PUT survive the page unloading, but is
                        // limited to a 64 KB body: above that, the browser rejects the request
                        // outright. Exactly that happened as soon as a real save was in the
                        // archive - a .MAN is about 34 KB - and the error stayed invisible, the
                        // save simply was not there. So only for small archives; above that,
                        // an ordinary PUT.
                        const klein = data.byteLength < 60000;
                        const antwort = await fetch(SAVE_URL, { method: "PUT", body: data, keepalive: klein });
                        if (!antwort.ok) {
                            throw new Error("Speichern fehlgeschlagen: HTTP " + antwort.status);
                        }
                    },
                },
            });
        }

        function versionAnzeigen() {
            // cache: no-store, otherwise after an update the page still shows the old
            // version from the disk cache, as happened after 5.0.7.
            fetch('version.txt', { cache: 'no-store' })
                .then(r => r.text())
                .then(v => {
                    const el = document.getElementById('version');
                    el.textContent = 'v' + v.trim() + ' \u00b7 ';
                    // Only the identifier is clickable, so a click next to it still lands in
                    // the game. user-select: all selects it completely with one click.
                    const kennung = document.createElement('span');
                    kennung.id = 'slot';
                    kennung.textContent = slot;
                    kennung.title = 'Speicherplatz. Mit ?slot=' + slot + ' auf einem anderen Geraet fortsetzen.';
                    el.appendChild(kennung);
                    el.append(' \u00b7 ');
                    const hilfe = document.createElement('a');
                    hilfe.href = 'hilfe.html';
                    hilfe.target = '_blank';
                    hilfe.rel = 'noopener';
                    hilfe.id = 'hilfe';
                    hilfe.textContent = 'Hilfe';
                    el.appendChild(hilfe);
                });
        }

        // Write the identifier into the address bar so the URL can be shared and
        // bookmarked. replaceState instead of pushState: no reload and no extra
        // entry in the history, the back button stays untouched.
        //
        // Whoever gets the link keeps playing on the same slot and overwrites the
        // state when saving. So it is no good for watching, but it is for playing
        // on together.
        function slotInUrlSchreiben() {
            try {
                const adresse = new URL(location.href);
                if (adresse.searchParams.get("slot") === slot) return;
                adresse.searchParams.set("slot", slot);
                history.replaceState(null, "", adresse);
            } catch { /* not critical, the identifier is also shown at the bottom right */ }
        }

        // The slot has to be settled before Dos(), because pull and push need its
        // address. The loading screen is already in the HTML and visible meanwhile.
        (async () => {
            slot = await slotErmitteln();
            SAVE_URL = "/api/saves/" + slot;
            slotInUrlSchreiben();
            versionAnzeigen();
            spielStarten();
        })();
    </script>
</body>
</html>
