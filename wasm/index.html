<!DOCTYPE html>
<html lang="de">
<head>
    <title>Bundesliga Manager Professional</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="utf-8">
    <style>
        body { margin: 0; background-color: #1a1a1a; height: 100%; display: flex; flex-direction: column; }
        html { height: 100%; }
        #jsdos { flex: 1; overflow: hidden; }
        #version { position: fixed; bottom: 4px; right: 8px; color: rgba(255,255,255,0.3); font: 11px monospace; z-index: 10; pointer-events: none; }
        #slot { pointer-events: auto; user-select: all; cursor: text; }

        #loader { position: fixed; inset: 0; z-index: 20; background: #1a1a1a; color: #e8e8e8;
                  display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 26px; font: 14px/1.7 system-ui, -apple-system, sans-serif; transition: opacity .3s ease; }
        #loader.done { opacity: 0; pointer-events: none; }
        #loader-spinner { width: 38px; height: 38px; border-radius: 50%;
                          border: 3px solid rgba(255,255,255,.15); border-top-color: #e8e8e8;
                          animation: loader-spin 1s linear infinite; }
        @keyframes loader-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #loader-spinner { animation: none; } }
        #loader-title { font-size: 17px; letter-spacing: .04em; }
        #loader-phases { list-style: none; margin: 0; padding: 0; min-width: 14em; }
        #loader-phases li { color: rgba(255,255,255,.3); }
        #loader-phases li::before { content: "\25CC  "; }
        #loader-phases li.active { color: #e8e8e8; }
        #loader-phases li.done { color: rgba(255,255,255,.5); }
        #loader-phases li.done::before { content: "\25CF  "; }
        #loader-hint { font-size: 12px; color: rgba(255,255,255,.28); }
        #loader.failed #loader-spinner { animation: none; border-top-color: #f87171; }
        #loader-error { display: none; color: #f87171; max-width: 26em; text-align: center; }
        #loader.failed #loader-error { display: block; }
        #loader.failed #loader-phases { display: none; }
    </style>
    <!-- Auf eine feste js-dos-Version gepinnt. Der offizielle CDN bietet nur
         /latest/, das sich unter dem Projekt weg bewegt; jsDelivr liefert dieselben
         Dateien byte-identisch aus dem npm-Paket. Beim Hochziehen daran denken, dass
         der Schutz in patchFrameLines() eine Interna von js-dos umhuellt. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/js-dos.css">
    <script src="https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/js-dos.js"></script>
</head>

<body>
    <div id="jsdos"></div>
    <div id="version"></div>

    <div id="loader">
        <div id="loader-spinner"></div>
        <div id="loader-title">Bundesliga Manager Professional</div>
        <ol id="loader-phases" role="status" aria-live="polite">
            <li></li><li></li><li></li>
        </ol>
        <div id="loader-error"></div>
        <div id="loader-hint">Der erste Start dauert einen Moment.</div>
    </div>

    <script>
        // Der Ladebildschirm verdeckt den Bootvorgang von DOSBox, bis das Spiel sein
        // erstes Bild zeichnet. Ohne ihn sieht man fast eine Minute lang nur die
        // DOS-Startmeldungen und haelt die Seite fuer kaputt.
        const loader = (() => {
            const el = document.getElementById("loader");
            const items = Array.from(document.querySelectorAll("#loader-phases li"));
            const labels = [
                ["Spieldaten laden …", "Spieldaten geladen"],
                ["Emulator starten …", "Emulator gestartet"],
                ["Spiel startet …", "Spiel gestartet"],
            ];
            let hidden = false;

            const phase = (index) => {
                items.forEach((li, i) => {
                    li.textContent = labels[i][i < index ? 1 : 0];
                    li.classList.toggle("done", i < index);
                    li.classList.toggle("active", i === index);
                });
            };

            const hide = () => {
                if (hidden) return;
                hidden = true;
                el.classList.add("done");
                setTimeout(() => el.remove(), 400);
            };

            const fail = (message) => {
                if (hidden) return;
                el.classList.add("failed");
                document.getElementById("loader-error").textContent = message;
                document.getElementById("loader-hint").textContent = "Klicken, um Details zu sehen.";
            };

            el.addEventListener("click", hide);   // Notausgang, falls doch etwas haengt
            setTimeout(() => {
                if (!hidden && !el.classList.contains("failed")) {
                    document.getElementById("loader-hint").textContent =
                        "Das dauert laenger als gewoehnlich. Klicken, um trotzdem zuzusehen.";
                }
            }, 20000);
            phase(0);
            return { phase, hide, fail };
        })();

        // Blendet den Ladebildschirm aus, sobald das laufende DOS-Programm den
        // Videomodus umschaltet. js-dos setzt dabei width und height direkt am
        // Canvas. Diese Attribute zu beobachten ist der einzige nicht-invasive Weg:
        // ci.events().onFrameSize() ist ein Setter und kein Listener, wer sich dort
        // eintraegt, ersetzt den Renderer von js-dos.
        function hideOnVideoModeChange() {
            const root = document.getElementById("jsdos");

            const watch = (canvas) => {
                const size = () => canvas.width + "x" + canvas.height;
                // Ein frisches Canvas steht auf der Browser-Vorgabe 300x150. Erst die
                // erste echte Groesse ist der DOS-Textmodus, die naechste das Spiel.
                const isReal = () => canvas.width > 0 && size() !== "300x150";
                let baseline = isReal() ? size() : null;

                new MutationObserver((_, obs) => {
                    if (!isReal()) return;
                    if (baseline === null) { baseline = size(); return; }
                    if (size() !== baseline) { obs.disconnect(); loader.hide(); }
                }).observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });
            };

            const canvas = root.querySelector("canvas");
            if (canvas) { watch(canvas); return; }

            new MutationObserver((_, obs) => {
                const late = root.querySelector("canvas");
                if (late) { obs.disconnect(); watch(late); }
            }).observe(root, { childList: true, subtree: true });
        }

        // js-dos liefert an onEvent nur bnd-play, ci-ready, emu-ready und
        // fullscreen-change. Ein Fehler-Event gibt es nicht: bnd-error und emu-error
        // sind bloss interne Zustaende. Ein fehlendes Bundle wuerde den Ladebildschirm
        // also endlos stehen lassen, darum diese beiden Absicherungen.
        const BUNDLE = "bmp.jsdos";

        // Jeder Besucher bekommt seinen eigenen Speicherplatz. Vorher lag ein einziger
        // Slot fuer alle unter /api/saves/bmp: wer die Seite oeffnete, lud den Stand des
        // letzten Spielers und ueberschrieb ihn beim naechsten Speichern.
        //
        // ?slot=<name> setzt den Platz und merkt ihn sich. Das deckt drei Faelle ab: den
        // alten gemeinsamen Stand weiterspielen (?slot=bmp), einen verlorenen Platz
        // zurueckholen, und denselben Stand auf einem zweiten Geraet fortsetzen.
        //
        // Eine Kennung ist keine Anmeldung. Wer sie kennt, kann diesen Stand lesen und
        // ueberschreiben; bei den zufaelligen Kennungen faellt das nicht ins Gewicht,
        // bei einem selbst gewaehlten Namen schon.
        const SLOT_MUSTER = /^[A-Za-z0-9_-]{1,64}$/;   // wie validName in server.go

        // Lesbare Kennungen statt einer UUID: man kann sie vorlesen, abtippen und
        // wiedererkennen, was bei ?slot= der eigentliche Zweck ist. Ohne Umlaute, damit
        // sie durch das Muster oben passen.
        //
        // Der Preis: 24 mal 24 mal 10000 sind rund 5,8 Millionen Kombinationen, deutlich
        // weniger als bei einer UUID. Wer die Schnittstelle durchprobiert, findet fremde
        // Spielstaende. Fuer diese Seite ist das vertretbar, eine Anmeldung war es
        // ohnehin nie.
        const WORT_A = ["flinke", "starke", "kuehne", "ruhige", "zaehe", "wendige",
                        "kluge", "freche", "helle", "kalte", "warme", "wilde",
                        "weise", "treue", "junge", "harte", "sanfte", "kecke",
                        "stolze", "rasche", "schlaue", "mutige", "stille", "frische"];
        const WORT_B = ["libero", "stuermer", "torwart", "spielmacher", "verteidiger",
                        "kapitaen", "elfmeter", "freistoss", "flanke", "kopfball",
                        "doppelpass", "konter", "abseits", "nachspielzeit", "rasen",
                        "tribuene", "pokal", "derby", "meister", "aufsteiger",
                        "kabine", "anstoss", "auswaertssieg", "eckball"];

        function neueKennung() {
            const zufall = (grenze) => crypto.getRandomValues(new Uint32Array(1))[0] % grenze;
            const nummer = String(zufall(10000)).padStart(4, "0");
            return WORT_A[zufall(WORT_A.length)] + "-" + WORT_B[zufall(WORT_B.length)] + "-" + nummer;
        }

        const slot = (() => {
            const lesen = () => { try { return localStorage.getItem("bmp-slot"); } catch { return null; } };
            const gueltig = (wert) => !!wert && SLOT_MUSTER.test(wert);

            const gewuenscht = new URLSearchParams(location.search).get("slot");
            const gemerkt = lesen();
            // Wer schon einen Platz hat, behaelt ihn, auch die alten UUID-Kennungen.
            const gewaehlt = gueltig(gewuenscht) ? gewuenscht
                           : gueltig(gemerkt) ? gemerkt
                           : neueKennung();

            // Im privaten Modus kann der Speicher fehlen. Dann bleibt der Platz nur fuer
            // diese Sitzung bestehen, deshalb wird die Kennung unten angezeigt.
            try { localStorage.setItem("bmp-slot", gewaehlt); } catch { /* nicht verfuegbar */ }
            return gewaehlt;
        })();

        const SAVE_URL = "/api/saves/" + slot;

        fetch(BUNDLE, { method: "HEAD" })
            .then((r) => { if (!r.ok) loader.fail("Spieldaten sind nicht erreichbar (HTTP " + r.status + ")."); })
            .catch(() => loader.fail("Spieldaten konnten nicht geladen werden."));

        // Kommt der Emulator gar nicht hoch, macht der Ladebildschirm den Weg frei auf
        // das, was js-dos selbst anzeigt. Sobald ci-ready gemeldet ist, laeuft er, und
        // dieser Notausgang wird geloescht: sonst legt er bei langsamem Start genau den
        // DOS-Bildschirm frei, den er verdecken soll.
        const bootTimeout = setTimeout(() => loader.hide(), 25000);

        // js-dos 8.4.1 stuerzt bei einem Videomodus-Wechsel gelegentlich ab. In
        // emulators.js legt onFrameSize() den Bildpuffer kleiner neu an, waehrend
        // onFrameLines() ihn ohne Pruefung beschreibt:
        //
        //   onFrameSize(w, h)  { this.rgb = new Uint8Array(w * h * 3); }
        //   onFrameLines(lines){ for (const l of lines) this.rgb.set(l.heapu8, l.start * this.frameWidth * 3); }
        //
        // Zeilen, die der Worker noch fuer den alten, groesseren Modus erzeugt hat,
        // schreiben dann hinter das Pufferende: "RangeError: offset is out of bounds",
        // was js-dos als "Backend crashed" anzeigt und das Spiel beendet. BMP wechselt
        // den Modus haeufig, entsprechend trifft es einen mitten im Spiel.
        //
        // Ein solches Paket ist ohnehin veraltet, also verwerfen wir es und warten auf
        // das naechste Bild. Der Feature-Check sorgt dafuer, dass eine kuenftige
        // js-dos-Version den Schutz hoechstens still abschaltet, statt zu brechen.
        function patchFrameLines(ci) {
            if (!ci || typeof ci.onFrameLines !== "function") return;
            const original = ci.onFrameLines.bind(ci);
            ci.onFrameLines = (lines, rgba) => {
                try {
                    return original(lines, rgba);
                } catch (e) {
                    if (e instanceof RangeError) return;   // Bild aus dem alten Videomodus
                    throw e;
                }
            };
        }

        // js-dos speichert von sich aus nur beim Verlassen des Vollbilds, beim
        // Freigeben des Pointer-Locks und bei visibilitychange. Beim Schliessen der
        // Seite passiert nichts, und ein periodisches Speichern gibt es entgegen
        // frueherer Annahme nicht. Wer also spielt und den Tab zumacht, verliert den
        // Fortschritt. Eine oeffentliche Speicher-API bietet js-dos 8.4.1 nicht, wohl
        // aber der Seitenleiste die Klasse .save-button - ein echter CSS-Name, keine
        // minifizierte Interna. Der Feature-Check laesst ein kuenftiges Umbenennen
        // still ausfallen, statt die Seite zu brechen.
        //
        // Gespeichert wird immer der Dateistand im Emulator, nicht der laufende
        // Spielzustand: im Spiel selbst gespeicherte Staende bleiben erhalten, eine
        // ungesicherte Partie nicht.
        const SAVE_INTERVALL_MS = 60000;

        function speichern() {
            const button = document.querySelector(".save-button");
            if (button) button.click();
        }

        function speichernEinrichten() {
            setInterval(speichern, SAVE_INTERVALL_MS);
            // Zusaetzlich, sobald die Seite in den Hintergrund geht - Tab gewechselt,
            // Fenster minimiert, Browser weggeklickt. Hier lebt die Seite noch, das
            // Archiv wird also fertig gebaut und der PUT geht durch. Bei pagehide ist
            // es dafuer zu spaet: gemessen kam dort kein Request mehr raus, deshalb
            // haengt hier nichts an diesem Ereignis.
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) speichern();
            });
        }

        Dos(document.getElementById("jsdos"), {
            url: BUNDLE,
            // Ohne pathPrefix laedt js-dos den Emulator weiter aus /latest/, womit
            // emulators.js und wdosbox.wasm ungepinnt blieben - also gerade die Datei
            // mit dem Fehler oben. Muss zur Version im script-Tag passen.
            pathPrefix: "https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/emulators/",
            autoStart: true,
            theme: "dark",
            autoSave: true,
            onEvent: (event, ci) => {
                if (event === "bnd-play") loader.phase(1);
                if (event === "ci-ready") {
                    patchFrameLines(ci);
                    speichernEinrichten();
                    clearTimeout(bootTimeout);
                    loader.phase(2);
                    hideOnVideoModeChange();
                    // Grosszuegig bemessen: ein Ladebildschirm, der zu lange steht, ist
                    // harmloser als einer, der den DOS-Bootvorgang freilegt. Wer nicht
                    // warten will, klickt ihn weg.
                    setTimeout(loader.hide, 120000);
                }
            },
            fsChanges: {
                local: false,
                pull: async (key) => {
                    const r = await fetch(SAVE_URL);
                    return r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
                },
                push: async (key, data) => {
                    // keepalive laesst einen noch laufenden PUT zu Ende gehen, wenn
                    // der Tab in diesem Moment geschlossen wird - etwa wenn kurz vorher
                    // der Wechsel in den Hintergrund ein Speichern angestossen hat.
                    // Gilt nur bis 64 KB Rumpf, ist also Beiwerk und keine Zusicherung.
                    await fetch(SAVE_URL, { method: "PUT", body: data, keepalive: true });
                },
            },
        });
        fetch('version.txt')
            .then(r => r.text())
            .then(v => {
                const el = document.getElementById('version');
                el.textContent = 'v' + v.trim() + ' \u00b7 ';
                // Nur die Kennung ist anklickbar, damit ein Klick daneben weiter im Spiel
                // landet. user-select: all waehlt sie mit einem Klick komplett aus.
                const kennung = document.createElement('span');
                kennung.id = 'slot';
                kennung.textContent = slot;
                kennung.title = 'Speicherplatz. Mit ?slot=' + slot + ' auf einem anderen Geraet fortsetzen.';
                el.appendChild(kennung);
            });
    </script>
</body>
</html>
